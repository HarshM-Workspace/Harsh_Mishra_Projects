name: Production Data Pipeline

on:
  schedule:
    # Daily at 02:00 IST (20:30 UTC previous day)
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      force_github_refresh:
        description: 'Force monthly GitHub snapshot extraction'
        required: false
        type: boolean
        default: false
      force_so_refresh:
        description: 'Force download and rebuild of Stack Overflow survey parquet'
        required: false
        type: boolean
        default: false

jobs:
  run-pipeline:
    name: Ingestion & MotherDuck Marts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Labor-Market-Intelligence

    env:
      PROJECT_ROOT: ${{ github.workspace }}/Labor-Market-Intelligence
      MotherDuck_token: ${{ secrets.MotherDuck_token || secrets.MOTHERDUCK_TOKEN || secrets.motherduck_token }}
      Adzuna_app_id: ${{ secrets.Adzuna_app_id || secrets.ADZUNA_APP_ID }}
      Adzuna_api: ${{ secrets.Adzuna_api || secrets.ADZUNA_API || secrets.ADZUNA_API_KEY }}
      GitHub_access_token: ${{ secrets.GH_ACCESS_TOKEN || secrets.GH_PAT || secrets.GitHub_access_token || secrets.GIT_ACCESS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pipeline dependencies
        run: |
          pip install --upgrade pip
          pip install dbt-core==1.11.12 dbt-duckdb==1.10.1 duckdb pandas pyarrow requests python-dotenv

      - name: Verify Environment Secrets
        run: |
          python -c "
          import os, sys
          md = os.getenv('MotherDuck_token')
          adz_id = os.getenv('Adzuna_app_id')
          adz_key = os.getenv('Adzuna_api')
          gh = os.getenv('GitHub_access_token')

          print('Secrets Presence Check:')
          print('  MotherDuck_token:', 'Configured' if md else 'MISSING')
          print('  Adzuna_app_id:   ', 'Configured' if adz_id else 'MISSING')
          print('  Adzuna_api:      ', 'Configured' if adz_key else 'MISSING')
          print('  GitHub token:    ', 'Configured' if gh else 'MISSING')

          if not md:
              print('\n' + '='*70)
              print('[FATAL ERROR] MotherDuck token is MISSING from GitHub Secrets!')
              print('dbt cannot connect to MotherDuck in headless CI without a valid token.')
              print('To fix this:')
              print('1. Go to: https://github.com/Tw1-Light/Harsh_Mishra_Projects/settings/secrets/actions')
              print('2. Under \"Repository secrets\", click \"New repository secret\"')
              print('3. Name: MotherDuck_token (or MOTHERDUCK_TOKEN)')
              print('4. Value: <Paste your MotherDuck token starting with eyJ...>')
              print('='*70 + '\n')
              sys.exit(1)
          "

      - name: Cache Stack Overflow Survey Parquet
        id: cache-so-survey
        uses: actions/cache@v4
        with:
          path: Labor-Market-Intelligence/raw/stackoverflow/filtered_survey.parquet
          key: so-filtered-survey-v2025

      - name: Build Stack Overflow Survey (if cache miss)
        if: steps.cache-so-survey.outputs.cache-hit != 'true' || inputs.force_so_refresh == true
        run: |
          echo "Fetching and preparing Stack Overflow Developer Survey..."
          if [ "${{ inputs.force_so_refresh }}" = "true" ]; then
            rm -f raw/stackoverflow/filtered_survey.parquet
          fi
          python raw/prepare_raw.py
          if [ -f raw/stackoverflow/survey_result.csv ]; then
            rm -f raw/stackoverflow/survey_result.csv
          fi

      - name: Cache GitHub Datasets
        id: cache-gh-data
        uses: actions/cache@v4
        with:
          path: |
            Labor-Market-Intelligence/raw/github/all_repos.parquet
            Labor-Market-Intelligence/raw/github/all_snapshots.parquet
          key: gh-parquets-v1

      - name: Extract Adzuna Job Postings (Daily)
        run: |
          echo "Running daily Adzuna job extraction..."
          python raw/adzuna/daily_data.py || true
          python raw/adzuna/build_adzuna_csv.py

      - name: Sync or Extract GitHub Snapshots
        run: |
          DAY=$(date +%d)
          if [ "${{ inputs.force_github_refresh }}" = "true" ] || [ "$DAY" = "01" ]; then
            echo "Monthly refresh triggered. Running GitHub extractor..."
            python raw/github/github_extractor.py
          else
            echo "Checking MotherDuck for existing full GitHub dataset..."
            if python scripts/sync_warehouse_cache.py; then
              echo "Reusing existing full dataset from MotherDuck. Skipped GitHub API extraction."
            else
              echo "MotherDuck has incomplete or missing GitHub data. Running full extractor..."
              python raw/github/github_extractor.py
            fi
          fi

      - name: Consolidate Raw Parquet Datasets
        run: |
          echo "Consolidating Parquet datasets for dbt ingestion..."
          python raw/prepare_raw.py

      - name: Install dbt packages
        run: dbt deps --profiles-dir dbt --project-dir dbt

      - name: Run dbt against MotherDuck (Production)
        run: |
          export MotherDuck_token="${MotherDuck_token:-$MOTHERDUCK_TOKEN}"
          export MOTHERDUCK_TOKEN="${MotherDuck_token}"
          dbt run --target prod --profiles-dir dbt --project-dir dbt

      - name: Run dbt Data Quality Tests (Production)
        run: |
          export MotherDuck_token="${MotherDuck_token:-$MOTHERDUCK_TOKEN}"
          export MOTHERDUCK_TOKEN="${MotherDuck_token}"
          dbt test --target prod --profiles-dir dbt --project-dir dbt

      - name: Pipeline Health Summary
        run: |
          python -c "
          import duckdb, os
          token = os.getenv('MotherDuck_token', '')
          if token:
              con = duckdb.connect(f'md:labor_market?motherduck_token={token}')
              count = con.execute('SELECT COUNT(*) FROM main_marts.fct_skill_signals').fetchone()[0]
              print(f'SUCCESS: main_marts.fct_skill_signals updated. Total rows: {count}')
          else:
              print('WARNING: MotherDuck_token not set. Verified syntax only.')
          "
