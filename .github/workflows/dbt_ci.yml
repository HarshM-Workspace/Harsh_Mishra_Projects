name: dbt CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  dbt-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install dbt-core dbt-duckdb pandas pyarrow duckdb

      - name: Prepare raw parquet files
        working-directory: Labor-Market-Intelligence
        env:
          PROJECT_ROOT: ${{ github.workspace }}/Labor-Market-Intelligence
        run: |
          # In CI: survey CSV and adzuna JSONs may not exist (they're .gitignored).
          # Build stub parquets so dbt can parse and test schema without real data.
          python scripts/ci_stub_data.py

      - name: Install dbt packages
        working-directory: Labor-Market-Intelligence/dbt
        run: dbt deps --profiles-dir . --project-dir .

      - name: dbt run
        working-directory: Labor-Market-Intelligence
        env:
          PROJECT_ROOT: ${{ github.workspace }}/Labor-Market-Intelligence
        run: dbt run --profiles-dir dbt --project-dir dbt

      - name: dbt test
        working-directory: Labor-Market-Intelligence
        env:
          PROJECT_ROOT: ${{ github.workspace }}/Labor-Market-Intelligence
        run: dbt test --profiles-dir dbt --project-dir dbt
